%YAML 1.1
---
$schema: "http://stsci.edu/schemas/yaml-schema/draft-01"
id: "asdf://astropy.org/photutils/schemas/psf/stdpsf-1.0.0"
title: STDPSF
description: |
  Schema for serializing "STDPSF" format ePSF grids to ASDF.

  By convention the model is saved under a key "stdpsf".


examples:
  -
    - An STDPSF ASDF file.
    - |
      !<tag:astropy.org:photutils/psf/stdpsf-1.0.0>
        data: !core/ndarray-1.1.0
          source: 0
          datatype: float32
          byteorder: big
          shape: [9, 101, 101]
        meta:
          STDPSF: dev/photutils/STDPSF_WFC3IR_F153M.fits
          detector: WFC3IR
          filter: F153M
          grid_shape: [3, 3]
          grid_xypos: !core/ndarray-1.1.0
            source: 3
            datatype: int64
            byteorder: little
            shape: [9, 2]
          oversampling: 4
        npsfs: 9
        nxpsfs: 101
        nypsfs: 101
        xgrid: !core/ndarray-1.1.0
          source: 1
          datatype: int64
          byteorder: little
          shape: [3]
        ygrid: !core/ndarray-1.1.0
          source: 2
          datatype: int64
          byteorder: little
          shape: [3]


type: object
properties:
  data:
    tag: "tag:stsci.edu:asdf/core/ndarray-1.*"
    description: Total integrated flux of the PSF.
  npsfs:
    type: integer
    description: |
  nxpsfs:
    type: integer
    description: |
  nypsfs:
    type: integer
  xgrid:
    tag: "tag:stsci.edu:asdf/core/ndarray-1.*"
    description: |
  ygrid:
    tag: "tag:stsci.edu:asdf/core/ndarray-1.*"
    description: |
  detector:
    type: string
    description: |
  meta:
    type: object
    properties:
      STDPSF:
        type: string
        description: |
      oversampling:
        type: integer
      detector:
        type: string
      filter:
        type: string
      grid_shape:
        type: array
      grid_xypos:
        tag: "tag:stsci.edu:asdf/core/ndarray-1.*"

required: [data, npsfs, nxpsfs, nypsfs, xgrid, ygrid, meta]
...
