# Labels applied to pull requests by .github/workflows/labeler.yml
# https://github.com/actions/labeler
#
# Each subpackage label also matches its user guide and API reference
# pages. The workflow only adds labels, so labels set by hand are kept.

aperture:
  - changed-files:
      - any-glob-to-any-file:
          - 'photutils/aperture/**'
          - 'docs/user_guide/aperture.rst'
          - 'docs/reference/aperture_api.rst'

asdf_serialization:
  - changed-files:
      - any-glob-to-any-file:
          - 'photutils/converters/**'
          - 'photutils/resources/**'
          - 'photutils/extension.py'
          - 'docs/user_guide/asdf.rst'

