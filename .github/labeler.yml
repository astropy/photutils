dev-automation:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.flake8'
          - '.pre-commit-config.yaml'
          - '.pycodestyle'
          - '.readthedocs.yaml'
          - 'codecov.yml'
          - 'tox.ini'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'CODE_OF_CONDUCT.rst'
          - 'CONTRIBUTING.rst'
          - 'README.rst'

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'
          - '.gitignore'
          - 'CITATION.cff'
          - 'photutils/__init__.py'
          - 'pyproject.toml'

# Applied when the test configuration changes or when every changed file
# is a test file. Almost every pull request touches the tests, so matching
# any test file would label nearly all of them. The two rules are combined
# with OR because they are options of the same changed-files entry.
testing:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/ci_*.yml'
          - '**/conftest.py'
          - 'codecov.yml'
          - 'tox.ini'
      - any-glob-to-all-files:
          - '**/tests/**'
