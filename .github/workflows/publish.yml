name: Wheel building

on:
  schedule:
    # Run every day at 4:30am UTC
    - cron: '30 4 * * *'
  pull_request:
    # We also want this workflow triggered if the 'Build all wheels'
    # label is added or present when PR is updated
    types:
      - synchronize
      - labeled
  push:
    branches:
      - 'main'
    tags:
      - '*'
      - '!*dev*'
      - '!*pre*'
      - '!*post*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build_and_publish:
    permissions:
      contents: none

    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1

    if: |
      github.repository == 'astropy/photutils' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'Build all wheels')
      )
    with:
      upload_to_pypi: false
      save_artifacts: true

      test_extras: test
      test_command: pytest -p no:warnings --pyargs photutils
      targets: |
        # Linux wheels
        - cp3*-manylinux_x86_64
        - target: cp3*-manylinux_aarch64
          runs-on: ubuntu-24.04-arm

        # MacOS X wheels
        - cp3*-macosx_x86_64
        - cp3*-macosx_arm64

        # Windows wheels
        - cp3*-win_amd64
        - cp3*-win_arm64

      # Developer wheels
      upload_to_anaconda: >-
        ${{ (github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch')
        }}
      anaconda_user: astropy
      anaconda_package: photutils
      anaconda_keep_n_latest: 10

    secrets:
      anaconda_token: ${{ secrets.anaconda_token }}

  upload:
    # This job publishes the built wheels to PyPI for all tags, except
    # those ending in ".dev". For PRs with the "Build all wheels" label,
    # wheels are built, but are not uploaded to PyPI.
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/photutils/
    # We upload to PyPI for all tag pushes, except tags ending in .dev
    if: |
      needs.build_and_publish.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') &&
      !endsWith(github.ref, '.dev') &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build_and_publish]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
