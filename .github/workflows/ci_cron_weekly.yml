name: Weekly Cron Tests

on:
  schedule:
    # Run every Monday at 5am UTC
    - cron: '0 5 * * 1'
  pull_request:
    # We also want this workflow triggered if the 'Weekly CI' label is added
    # or present when PR is updated
    types:
      - synchronize
      - labeled
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOXARGS: '-v'

jobs:
  tests:
    if: |
      github.repository == 'astropy/photutils' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'Weekly CI')
      )
    name: ${{ matrix.os }}, ${{ matrix.tox_env }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.15'
            tox_env: 'py315-test-alldeps-devinfra'
            toxposargs: -n=auto
            allow_failure: false

          # Run each test in several threads at once on a free-threaded
          # build to catch thread-safety bugs. Astropy, pyerfa, and
          # regions do not yet provide free-threaded wheels, so they are
          # built from source.
          - os: ubuntu-latest
            python: '3.14t'
            tox_env: 'py314t-test-alldeps-parallel'
            toxposargs: ''
            allow_failure: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install base dependencies
        run: python -m pip install --upgrade pip setuptools tox
      - name: Print Python, pip, setuptools, and tox versions
        run: |
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "import pip; print(f'pip {pip.__version__}')"
          python -c "import setuptools; print(f'setuptools {setuptools.__version__}')"
          python -c "import tox; print(f'tox {tox.__version__}')"
      - name: Run tests
        run: python -m tox -e ${{ matrix.tox_env }} -- ${{ matrix.toxposargs }}

  test_more_architectures:
    # The following architectures are emulated and are therefore slow, so
    # we include them just in the weekly cron. These also serve as a test
    # of using system libraries and using pytest directly. The i386 image
    # runs natively on the x86_64 runner. Debian's i386 compiler uses the
    # x87 FPU, whose extended-precision intermediates the other
    # architectures do not exercise.

    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: More architectures
    if: |
      github.repository == 'astropy/photutils' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'Arch CI')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: s390x
          - arch: ppc64le
          - arch: armv7
          - arch: none
            distro: none
            base_image: --platform=linux/386 i386/debian:sid

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: uraimo/run-on-arch-action@fa1f3e7de95534497266c7265950b5188355fbfb # v3.2.1
        name: Run tests
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro || 'ubuntu_rolling' }}
          base_image: ${{ matrix.base_image }}

          shell: /bin/bash

          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
                                  git \
                                  g++ \
                                  python3 \
                                  python3-astropy \
                                  python3-erfa \
                                  python3-extension-helpers \
                                  python3-numpy \
                                  python3-pytest \
                                  python3-pytest-astropy-header \
                                  python3-pytest-doctestplus \
                                  python3-pytest-remotedata \
                                  python3-setuptools-scm \
                                  python3-scipy \
                                  python3-venv \
                                  python3-wheel

          run: |
            uname -a
            echo "LONG_BIT="$(getconf LONG_BIT)
            python3 -m venv --system-site-packages tests
            source tests/bin/activate
            # Update older versions
            pip install -U cython setuptools packaging
            pip3 install -v --no-build-isolation -e .[test]
            pip3 list
            python3 -m pytest
